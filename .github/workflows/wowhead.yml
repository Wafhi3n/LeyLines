# La veille Wowhead : les fissures et tornades que Wowhead montre et que la liste commune n'a pas
# → une branche feat/positions-wowhead-AAAA-MM-JJ prête à relire.
#
# PLUS DE CRON depuis le 2026-10-16 : Wowhead défie les robots (pare-feu AWS WAF, 202 vide +
# `x-amzn-waf-action: challenge`), le runner ne lit plus ses pages, et on ne contourne pas le défi.
# La veille se fait à la main (pages enregistrées par le user, cf. .github/scripts/wowhead.sh) ; ce
# workflow ne sert plus qu'à essayer, à la main, si Wowhead a levé le défi.
#
# Ne fusionne, ne tague, ne publie rien. Le travail est dans .github/scripts/wowhead.sh (tri et
# sécurité : tools/ll_wowhead.lua). Deux pages lues par passage, rien d'autre.
#
# Une page illisible ou refusée fait ÉCHOUER le job, en disant pourquoi : un échec se voit, un
# « rien de neuf » silencieux ne se verrait jamais.
name: Wowhead watch

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Tout vérifier, ne rien pousser
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wowhead-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          command -v lua5.1 && command -v luac5.1

      - name: Wowhead vers branche
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: bash .github/scripts/wowhead.sh
